<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Bus">
<meta name="theme-color" content="#f4f4f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0a0a0b" media="(prefers-color-scheme: dark)">
<title>Bus</title>
<link rel="apple-touch-icon" href="apple-touch-icon-180.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<style>
  :root {
    --bg:#f4f4f6; --card:#ffffff; --txt:#111113; --dim:#6b6b73; --faint:#a1a1aa; --line:#ececf0; --fill:#f1f1f4;
    --red:#ff3b30; --amber:#ff9500; --green:#28c76f; --blue:#0a84ff; --brand:#e1251b;
    --shadow:0 1px 1px rgba(16,16,24,.03), 0 8px 24px rgba(16,16,24,.06);
    --r:22px;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0a0a0b; --card:#17171a; --txt:#f4f4f5; --dim:#9a9aa3; --faint:#5c5c66; --line:#26262b; --fill:#222227;
            --shadow:0 0 0 1px rgba(255,255,255,.04); }
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html { background:var(--bg); }
  body { margin:0; color:var(--txt); font:16px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", system-ui, sans-serif;
         -webkit-font-smoothing:antialiased; }
  button { font:inherit; color:inherit; cursor:pointer; border:0; background:none; padding:0; }
  .num { font-variant-numeric:tabular-nums; }
  .app { max-width:460px; margin:0 auto; padding:calc(env(safe-area-inset-top) + 14px) 18px calc(env(safe-area-inset-bottom) + 36px); }

  /* ---------- header ---------- */
  .top { display:flex; align-items:center; justify-content:space-between; margin:6px 2px 18px; }
  .date { font-size:13px; color:var(--dim); font-weight:500; }
  .switcher { display:flex; align-items:center; gap:6px; font-size:28px; font-weight:700; letter-spacing:-.025em; margin-top:2px; }
  .switcher .chev { font-size:15px; color:var(--faint); transform:translateY(2px); }
  .round { width:40px; height:40px; border-radius:50%; background:var(--card); box-shadow:var(--shadow); display:grid; place-items:center; color:var(--dim); }
  .round svg { width:20px; height:20px; }

  .card { background:var(--card); border-radius:var(--r); box-shadow:var(--shadow); margin-bottom:14px; overflow:hidden; }

  /* ---------- hero ---------- */
  .hero { padding:20px 20px 18px; }
  .hero-top { display:flex; align-items:center; gap:10px; }
  .badge { flex:none; height:28px; min-width:44px; padding:0 9px; border-radius:7px; background:var(--brand); color:#fff;
           font-weight:700; font-size:15px; display:grid; place-items:center; letter-spacing:-.01em; }
  .hero-route { min-width:0; font-size:14px; color:var(--dim); line-height:1.3; }
  .hero-route b { color:var(--txt); font-weight:600; display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .hero-label { margin-top:20px; font-size:15px; font-weight:600; color:var(--dim); }
  .hero-big { font-size:64px; font-weight:700; letter-spacing:-.045em; line-height:1; margin-top:4px; }
  .hero-big small { font-size:24px; letter-spacing:-.01em; font-weight:600; margin-left:4px; }
  .hero.ok .hero-big { color:var(--green); } .hero.ready .hero-big { color:var(--amber); } .hero.now .hero-big { color:var(--red); }
  .facts { display:grid; grid-template-columns:repeat(3, 1fr); margin-top:18px; border-top:1px solid var(--line); padding-top:14px; }
  .fact .k { font-size:12px; color:var(--dim); } .fact .v { font-size:17px; font-weight:600; margin-top:1px; }
  .hero-btn { width:100%; margin-top:16px; padding:13px; border-radius:14px; background:var(--fill); color:var(--blue); font-weight:600; font-size:15px; }
  .hero.empty { text-align:center; padding:30px 24px; }
  .hero.empty .t { font-size:18px; font-weight:600; } .hero.empty .s { font-size:14px; color:var(--dim); margin-top:6px; }

  /* ---------- alarm row ---------- */
  .row { display:flex; align-items:center; gap:14px; padding:16px 18px; }
  .row .ic { width:36px; height:36px; border-radius:10px; display:grid; place-items:center; background:var(--fill); font-size:18px; flex:none; }
  .row .tx { flex:1; min-width:0; } .row .t { font-weight:600; } .row .s { font-size:13px; color:var(--dim); }
  .switch { position:relative; flex:none; width:51px; height:31px; border-radius:999px; background:var(--line); transition:background .2s; }
  .switch::after { content:""; position:absolute; top:2px; left:2px; width:27px; height:27px; border-radius:50%; background:#fff;
                   box-shadow:0 2px 5px rgba(0,0,0,.2); transition:transform .2s; }
  .switch.on { background:var(--green); } .switch.on::after { transform:translateX(20px); }

  /* ---------- list ---------- */
  .head { display:flex; align-items:baseline; justify-content:space-between; margin:24px 4px 10px; }
  .head h2 { font-size:20px; margin:0; letter-spacing:-.015em; }
  .head span { font-size:13px; color:var(--dim); display:flex; align-items:center; gap:6px; }
  .dot { width:7px; height:7px; border-radius:50%; background:var(--green); animation:pulse 2s infinite; }
  @keyframes pulse { 0% { box-shadow:0 0 0 0 rgba(40,199,111,.55); } 70%,100% { box-shadow:0 0 0 7px rgba(40,199,111,0); } }
  .bus { display:flex; align-items:center; gap:14px; padding:14px 18px; width:100%; text-align:left; }
  .bus + .bus { border-top:1px solid var(--line); }
  .mins { flex:none; width:58px; text-align:center; }
  .mins b { display:block; font-size:26px; font-weight:700; letter-spacing:-.03em; line-height:1; }
  .mins i { font-style:normal; font-size:11px; color:var(--dim); font-weight:600; text-transform:uppercase; letter-spacing:.05em; }
  .bus .mid { flex:1; min-width:0; }
  .bus .t { font-weight:600; } .bus .s { font-size:13px; color:var(--dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .state { flex:none; font-size:12px; font-weight:700; padding:6px 10px; border-radius:999px; }
  .ok .state { color:var(--green); background:color-mix(in srgb, var(--green) 14%, transparent); }
  .ready .state { color:var(--amber); background:color-mix(in srgb, var(--amber) 16%, transparent); }
  .now .state { color:#fff; background:var(--red); }
  .late { opacity:.42; } .late .state { color:var(--dim); background:var(--fill); }
  .ok .mins b { color:var(--green); } .ready .mins b { color:var(--amber); } .now .mins b { color:var(--red); }
  .list-empty { padding:26px 20px; text-align:center; color:var(--dim); font-size:14px; }
  .foot { text-align:center; font-size:12px; color:var(--faint); margin-top:18px; line-height:1.6; }
  .notice summary { list-style:none; display:flex; align-items:center; gap:12px; padding:14px 18px; cursor:pointer; }
  .notice summary::-webkit-details-marker { display:none; }
  .notice .ndot { width:10px; height:10px; border-radius:50%; background:var(--amber); flex:none; }
  .notice .tx { flex:1; display:flex; flex-direction:column; } .notice .tx span { font-size:13px; color:var(--dim); }
  .notice .chev { color:var(--faint); font-size:22px; transition:transform .2s; } .notice[open] .chev { transform:rotate(90deg); }
  .notice p { margin:0; padding:0 18px 14px 40px; font-size:14px; color:var(--dim); }
  .head { margin-top:24px; }
  .warn { padding:14px 18px; color:var(--red); font-size:14px; }

  /* ---------- alarm overlay ---------- */
  .banner { position:fixed; inset:0; z-index:2000; display:none; flex-direction:column; align-items:center; justify-content:center;
            gap:8px; padding:30px; text-align:center; color:#fff; background:var(--red); animation:flash 1s infinite; }
  .banner.show { display:flex; }
  .banner .e { font-size:64px; } .banner h3 { font-size:44px; margin:0; letter-spacing:-.03em; } .banner p { font-size:18px; margin:0 0 28px; opacity:.92; }
  .banner button { padding:18px 48px; border-radius:18px; font-size:19px; font-weight:700; background:#fff; color:#000; }
  @keyframes flash { 50% { background:#c8161d; } }

  /* ---------- sheets ---------- */
  dialog { border:0; padding:0; color:var(--txt); background:var(--bg); width:100%; max-width:460px; height:min(92dvh, 780px); max-height:none;
           border-radius:24px 24px 0 0; margin:auto auto 0; overflow:hidden; }
  dialog.small { height:fit-content; max-height:92dvh; }
  .sh-head button:focus { outline:none; }
  dialog[open] { display:flex; flex-direction:column; animation:up .28s cubic-bezier(.2,.8,.2,1); }
  @media (min-width:600px) { dialog { border-radius:24px; margin:auto; } }
  @keyframes up { from { transform:translateY(40px); opacity:0; } }
  dialog::backdrop { background:rgba(0,0,0,.38); backdrop-filter:blur(2px); }
  .sh-head { display:flex; align-items:center; justify-content:space-between; padding:14px 14px 0; min-height:52px; }
  .sh-head .l, .sh-head .r { min-width:72px; } .sh-head .r { text-align:right; }
  .txt-btn { color:var(--blue); font-size:16px; padding:8px; } .txt-btn.b { font-weight:600; }
  .steps { display:flex; gap:5px; justify-content:center; }
  .steps i { width:22px; height:4px; border-radius:2px; background:var(--line); } .steps i.on { background:var(--txt); }
  .sh-body { flex:1; overflow:auto; padding:8px 18px 24px; }
  .sh-title { font-size:26px; font-weight:700; letter-spacing:-.025em; margin:10px 0 4px; }
  .sh-sub { color:var(--dim); font-size:15px; margin:0 0 16px; }
  .search { display:flex; align-items:center; gap:8px; background:var(--card); border-radius:14px; padding:0 14px; box-shadow:var(--shadow); margin-bottom:14px; }
  .search input { flex:1; border:0; outline:0; background:none; color:var(--txt); font-size:17px; padding:13px 0; }
  .search svg { width:18px; height:18px; color:var(--faint); flex:none; }
  .lines { display:grid; grid-template-columns:repeat(auto-fill, minmax(64px, 1fr)); gap:8px; }
  .lgroup { display:flex; justify-content:space-between; font-size:13px; font-weight:600; color:var(--dim); text-transform:uppercase; letter-spacing:.04em; margin:18px 4px 8px; }
  .lgroup:first-child { margin-top:4px; } .lgroup span { color:var(--faint); }
  .lines button { height:44px; border-radius:11px; background:var(--card); box-shadow:var(--shadow); font-weight:700; font-size:16px; }
  .lines button:active { background:var(--brand); color:#fff; }
  .dir { display:block; width:100%; text-align:left; background:var(--card); box-shadow:var(--shadow); border-radius:18px; padding:18px; margin-bottom:12px; }
  .dir .k { font-size:13px; color:var(--dim); } .dir .v { font-size:20px; font-weight:700; letter-spacing:-.015em; margin:2px 0 6px; }
  .dir .s { font-size:13px; color:var(--dim); }
  .tl { background:var(--card); border-radius:18px; box-shadow:var(--shadow); padding:6px 0; }
  .tl button { display:flex; align-items:center; gap:14px; width:100%; text-align:left; padding:10px 16px; position:relative; }
  .tl button::before { content:""; position:absolute; left:27px; top:0; bottom:0; width:3px; background:color-mix(in srgb, var(--brand) 30%, transparent); }
  .tl button:first-child::before { top:50%; } .tl button:last-child::before { bottom:50%; }
  .tl .pt { position:relative; z-index:1; width:25px; height:25px; flex:none; border-radius:50%; background:var(--card); border:3px solid var(--brand);
            display:grid; place-items:center; font-size:9px; font-weight:800; color:var(--brand); }
  .tl .nm { font-weight:500; } .tl .tw { font-size:12px; color:var(--dim); }
  .tl button:active { background:var(--fill); }
  .stepper { display:flex; align-items:center; justify-content:space-between; background:var(--card); border-radius:18px; box-shadow:var(--shadow); padding:14px 16px; margin-bottom:12px; }
  .stepper .k { font-weight:600; } .stepper .s { font-size:13px; color:var(--dim); }
  .stepper .ctl { display:flex; align-items:center; gap:14px; }
  .stepper .ctl button { width:36px; height:36px; border-radius:50%; background:var(--fill); font-size:20px; font-weight:600; color:var(--blue); }
  .stepper .ctl b { min-width:48px; text-align:center; font-size:20px; }
  .field { background:var(--card); border-radius:18px; box-shadow:var(--shadow); padding:10px 16px; margin-bottom:12px; }
  .field label { font-size:12px; color:var(--dim); display:block; }
  .field input { width:100%; border:0; outline:0; background:none; color:var(--txt); font-size:17px; padding:4px 0 2px; }
  .primary { width:100%; padding:16px; border-radius:16px; background:var(--txt); color:var(--bg); font-weight:700; font-size:17px; margin-top:8px; }
  .primary:disabled { opacity:.35; }
  .ghost { width:100%; padding:14px; border-radius:16px; color:var(--blue); font-weight:600; margin-top:6px; }
  .danger { width:100%; padding:15px; border-radius:16px; background:var(--card); box-shadow:var(--shadow); color:var(--red); font-weight:600; margin-top:12px; }
  .pick { display:flex; align-items:center; gap:12px; width:100%; text-align:left; padding:14px 16px; }
  .pick + .pick { border-top:1px solid var(--line); }
  .pick .tx { flex:1; min-width:0; } .pick .t { font-weight:600; } .pick .s { font-size:13px; color:var(--dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .pick .ck { color:var(--blue); font-weight:700; }
  .bigtime { text-align:center; font-size:56px; font-weight:700; letter-spacing:-.04em; margin:8px 0 0; }
  .guide { background:var(--card); border-radius:18px; box-shadow:var(--shadow); padding:6px 16px; margin-top:12px; }
  .guide ol { margin:8px 0; padding-left:20px; } .guide li { margin:9px 0; font-size:15px; } .guide code { white-space:nowrap; background:var(--fill); padding:1px 6px; border-radius:6px; font-size:14px; }
  .loading { text-align:center; color:var(--dim); padding:30px; }
</style>
</head>
<body>
<main class="app">
  <div class="top">
    <div>
      <div class="date num" id="date"></div>
      <button class="switcher" id="switcher"><span id="title">Bus</span><span class="chev">▼</span></button>
    </div>
    <button class="round" id="editBtn" aria-label="Route settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </div>

  <div id="hero"></div>
  <div id="alarmRow"></div>
  <div id="list"></div>
  <div class="foot" id="foot"></div>
</main>

<div class="banner" id="banner"><div class="e">🏃</div><h3>Leave now</h3><p id="bannerText"></p><button id="stopAlarm">Stop alarm</button></div>

<dialog id="wiz"><div class="sh-head"><div class="l"><button class="txt-btn" id="wBack">Cancel</button></div><div class="steps" id="wSteps"></div><div class="r"></div></div><div class="sh-body" id="wBody"></div></dialog>
<dialog id="routesDlg" class="small"><div class="sh-head"><div class="l"></div><b>Your routes</b><div class="r"><button class="txt-btn b" data-close>Done</button></div></div><div class="sh-body" id="routesBody"></div></dialog>
<dialog id="alarmDlg" class="small"><div class="sh-head"><div class="l"></div><b>Phone alarm</b><div class="r"><button class="txt-btn b" data-close>Close</button></div></div><div class="sh-body" id="alarmBody"></div></dialog>
<dialog id="editDlg" class="small"><div class="sh-head"><div class="l"><button class="txt-btn" data-close>Cancel</button></div><b>Route settings</b><div class="r"><button class="txt-btn b" id="eSave">Save</button></div></div><div class="sh-body" id="editBody"></div></dialog>

<script>
"use strict";
const API = "https://api.tfl.gov.uk";
const SHORTCUT = "Bus Alarm";            // iPhone Shortcut that creates a Clock alarm
const POLL_MS = 30000;
// All London bus routes (snapshot). Refreshed from TfL once a day so new/withdrawn routes are picked up.
const BUILTIN_LINES = "__LINES__".split(" ");
// Built-in routes: always present, can't be deleted (name / walk / spare edits are kept).
// Stop E is listed by TfL as "Shoreditch High Street Station" (Stop E) — same spot as Commercial St / Worship St.
const BUILTIN_ROUTES = [
  { id:"135-to-work", builtin:true, name:"135 to work", line:"135", direction:"outbound",
    boardId:"490016668K", boardStop:"Canary Wharf Station", boardLetter:"K",
    alightId:"490005524E", alightName:"Commercial Street / Worship Street", alightLetter:"E", walk:15, buffer:1, ready:5 },
  { id:"135-home", builtin:true, name:"135 home", line:"135", direction:"inbound",
    boardId:"490005524D", boardStop:"Commercial Street / Worship Street", boardLetter:"D",
    alightId:"490016668L", alightName:"Canary Wharf Station", alightLetter:"L", walk:7, buffer:1, ready:5 },
];
const MIN = 60000;

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const hm = t => new Date(t).toLocaleTimeString("en-GB", { hour:"2-digit", minute:"2-digit" });
const today = () => new Date().toDateString();
const getJSON = async path => { const r = await fetch(API + path); if (!r.ok) throw new Error(r.status); return r.json(); };
const icon = { search:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>` };

// ---------- persistent state ----------
const saved = JSON.parse(localStorage.getItem("routes") || "null") || [];
const legacyDefault = r => !r.id && r.line === "135" && r.boardId === "490016668K";   // the old single built-in route
saved.forEach(r => {   // upgrade routes saved by older versions
  if (!r.boardStop && r.boardName) { const m = r.boardName.match(/^(.*) \(Stop (.*)\)$/); r.boardStop = m ? m[1] : r.boardName; r.boardLetter = m ? m[2] : ""; }
  if (!r.alightId && r.alightIds?.length) r.alightId = r.alightIds.find(id => id === "490005524E") || r.alightIds[0];
  r.ready ??= 5;
});
let routes = [
  ...BUILTIN_ROUTES.map(b => { const u = saved.find(x => x.id === b.id) || saved.find(x => b.id === "135-to-work" && legacyDefault(x));
                               return u ? { ...b, name:u.name, walk:u.walk, buffer:u.buffer } : { ...b }; }),
  ...saved.filter(x => !BUILTIN_ROUTES.some(b => b.id === x.id) && !legacyDefault(x)),
];
let current = Math.min(+localStorage.getItem("current") || 0, Math.max(routes.length - 1, 0));
const save = () => { localStorage.setItem("routes", JSON.stringify(routes)); localStorage.setItem("current", current); };
save();
const route = () => routes[current];

// ---------- daily-refreshed reference data ----------
async function busLines() {
  const c = JSON.parse(localStorage.getItem("lines") || "null");
  if (c?.date === today()) return c.ids;
  try {
    const nat = s => [s.replace(/\d+/g, ""), +(s.match(/\d+/)?.[0] || 0), s];
    const ids = (await getJSON("/Line/Mode/bus")).map(l => l.id)
      .sort((a, b) => { const x = nat(a), y = nat(b); return x[0].localeCompare(y[0]) || x[1] - y[1] || x[2].localeCompare(y[2]); });
    localStorage.setItem("lines", JSON.stringify({ date: today(), ids }));
    return ids;
  } catch { return c?.ids || BUILTIN_LINES; }
}
const seqCache = {};
async function sequence(line, dir) {   // stops in order + map geometry for one direction (cached per day)
  const key = `${line}|${dir}|${today()}`;
  if (seqCache[key]) return seqCache[key];
  const d = await getJSON(`/Line/${encodeURIComponent(line)}/Route/Sequence/${dir}`);
  const stops = {};
  for (const sps of d.stopPointSequences || []) for (const s of sps.stopPoint)
    stops[s.id] = { id:s.id, name:s.name, letter:s.stopLetter && !s.stopLetter.startsWith("->") ? s.stopLetter : "" };
  const orders = (d.orderedLineRoutes || []).map(o => o.naptanIds.filter(id => stops[id])).filter(o => o.length).sort((a, b) => b.length - a.length);
  return (seqCache[key] = { stops, orders, from: stops[orders[0]?.[0]]?.name, to: stops[orders[0]?.at(-1)]?.name });
}

const rideCache = {};
async function rideTimes(r) {   // TfL scheduled minutes from the boarding stop to each later stop (cached per day)
  const key = `${r.line}|${r.boardId}|${r.direction}|${today()}`;
  if (rideCache[key]) return rideCache[key];
  const t = await getJSON(`/Line/${encodeURIComponent(r.line)}/Timetable/${r.boardId}?direction=${r.direction || "outbound"}`);
  const m = {};
  for (const i of t.timetable?.routes?.[0]?.stationIntervals?.[0]?.intervals || []) m[i.stopId] = i.timeToArrival;
  return (rideCache[key] = m);
}

let planCache = { key:"", at:0, trips:[] };
async function plannerTrips(r) {   // TfL Journey Planner, refreshed at most once a minute
  const key = `${r.line}|${r.boardId}|${r.alightId}`;
  if (planCache.key === key && Date.now() - planCache.at < MIN) return planCache.trips.map(t => ({ ...t }));
  try {
    const d = await getJSON(`/Journey/JourneyResults/${r.boardId}/to/${r.alightId}?mode=bus&journeyPreference=leastinterchange`);
    const trips = (d.journeys || []).map(j => j.legs.filter(l => l.mode?.id === "bus"))
      .filter(legs => legs.length === 1 && legs[0].routeOptions?.some(o => o.name?.toLowerCase() === r.line))
      .map(([l]) => ({ dep: new Date(l.departureTime).getTime(), arr: new Date(l.arrivalTime).getTime() }));
    planCache = { key, at: Date.now(), trips };
  } catch {}
  return planCache.key === key ? planCache.trips.map(t => ({ ...t })) : [];
}

// ---------- live data ----------
let openNotice = false;
let live = [], status = null, disruptions = [], err = "", fetched = 0, loading = true, seq = null, lineGone = false;
async function refresh() {
  const r = route(); if (!r) return renderAll();
  try {
    const arr = (await getJSON(`/StopPoint/${r.boardId}/Arrivals`)).filter(a => a.lineId === r.line)
      .sort((a, b) => Date.parse(a.expectedArrival) - Date.parse(b.expectedArrival));
    const trips = {};
    if (arr.length) try {
      for (const p of await getJSON(`/Vehicle/${arr.map(a => a.vehicleId).join(",")}/Arrivals`))
        if (p.lineId === r.line) (trips[p.vehicleId] ||= []).push({ id:p.naptanId, name:p.stationName, t:Date.parse(p.expectedArrival) });
    } catch {}
    live = arr.map(a => {
      const at = Date.parse(a.expectedArrival);
      const preds = (trips[a.vehicleId] || []).sort((x, y) => x.t - y.t);
      return { id:a.vehicleId, at, preds, off: preds.find(p => p.id === r.alightId && p.t > at)?.t ?? null, offEst:false };
    });
    // TfL only predicts ~30 min ahead per bus. If the getting-off stop isn't covered yet, estimate it:
    // last live prediction for this bus + TfL's scheduled ride time from there to the stop.
    // 2nd choice: TfL Journey Planner (the official planner behind TfL's route search) — departure adjusted live,
    // arrival from TfL's time-of-day running times. Matched to each live bus by departure time.
    const plan = r.alightId ? await plannerTrips(r) : [];
    for (const b of live) {
      if (b.off) continue;
      const m = plan.filter(j => !j.used && Math.abs(j.dep - b.at) <= 4 * MIN).sort((x, y) => Math.abs(x.dep - b.at) - Math.abs(y.dep - b.at))[0];
      if (m) { m.used = true; b.off = m.arr + (b.at - m.dep); b.offEst = true; }
    }
    // 3rd choice (only if the planner had nothing): TfL's scheduled ride time from the last live point.
    let ride = {};
    try { if (r.alightId && live.some(b => !b.off)) ride = await rideTimes(r); } catch {}
    if (ride[r.alightId] != null) for (const b of live) {
      if (b.off) continue;
      const last = [...b.preds].reverse().find(p => p.t >= b.at && ride[p.id] != null && ride[p.id] <= ride[r.alightId]);
      b.off = last ? last.t + (ride[r.alightId] - ride[last.id]) * MIN : b.at + ride[r.alightId] * MIN;
      b.offEst = true;
    }
    err = "";
  } catch { err = "Can't reach TfL right now — retrying…"; }
  try { seq = await sequence(r.line, r.direction || "outbound"); } catch {}
  try {
    const ls = (await getJSON(`/Line/${r.line}/Status`))[0].lineStatuses;
    status = [...new Set(ls.map(s => s.statusSeverityDescription))].join(", ");
    disruptions = [...new Set(ls.filter(s => s.reason).map(s => s.reason.trim()))];
  } catch {}
  busLines().then(ids => { lineGone = !ids.includes(r.line); });
  fetched = Date.now(); loading = false;
  renderAll();
}

// ---------- helpers ----------
function stateOf(r, at, now) {
  const eta = (at - now) / MIN, leaveIn = eta - r.walk;
  const cls = leaveIn < -1 ? "late" : leaveIn <= r.buffer ? "now" : leaveIn <= r.buffer + r.ready ? "ready" : "ok";
  return { eta, leaveIn, cls, leaveAt: at - r.walk * MIN };
}
const stopsAway = (b, now) => b.preds.length ? b.preds.filter(p => p.t > now && p.t < b.at).length : null;
const nearName = (b, now) => b.preds.find(p => p.t > now)?.name || "";
const mmss = m => { const s = Math.max(0, Math.round(m * 60)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; };

// ---------- render ----------
function renderAll() { renderHeader(); renderHero(); renderAlarm(); renderList(); }
function renderHeader() {
  const r = route();
  $("date").textContent = new Date().toLocaleString("en-GB", { weekday:"long", day:"numeric", month:"short" }) + " · " + new Date().toLocaleTimeString("en-GB");
  $("title").textContent = r ? r.name : "Add a route";
  $("editBtn").style.visibility = r ? "visible" : "hidden";
}
function renderHero() {
  const r = route(), now = Date.now();
  if (!r) { $("hero").innerHTML = `<div class="card hero empty"><div class="t">No routes yet</div><div class="s">Tap the title to add your first route.</div></div>`; return; }
  const head = `<div class="hero-top"><div class="badge">${esc(r.line.toUpperCase())}</div>
    <div class="hero-route"><b>${esc(r.boardStop)}${r.boardLetter ? ` · Stop ${esc(r.boardLetter)}` : ""}</b>${r.alightName ? `to ${esc(r.alightName)}${r.alightLetter ? ` · Stop ${esc(r.alightLetter)}` : ""}` : `towards ${esc(seq?.to || "")}`}</div></div>`;
  const next = live.find(b => b.at > now && stateOf(r, b.at, now).leaveIn >= -1);
  if (loading) { $("hero").innerHTML = `<div class="card hero">${head}<div class="hero-label">Getting live times…</div></div>`; return; }
  if (!next) {
    $("hero").innerHTML = `<div class="card hero">${head}<div class="hero-label">No bus you can catch yet</div>
      <div class="s" style="font-size:14px;color:var(--dim);margin-top:6px">TfL only shows buses about 30 minutes ahead. The next one will appear here as soon as it's tracked.</div></div>`;
    return;
  }
  const s = stateOf(r, next.at, now);
  const label = s.cls === "now" ? "Time to go" : "Leave in";
  const big = s.cls === "now" ? "Now" : s.leaveIn < 60 ? mmss(s.leaveIn) : `${Math.floor(s.leaveIn)}<small>min</small>`;
  $("hero").innerHTML = `<div class="card hero ${s.cls}">${head}
    <div class="hero-label">${label}</div><div class="hero-big num">${big}</div>
    <div class="facts">
      <div class="fact"><div class="k">Leave by</div><div class="v num">${hm(s.leaveAt)}</div></div>
      <div class="fact"><div class="k">Bus at stop</div><div class="v num">${hm(next.at)}</div></div>
      <div class="fact"><div class="k">${r.alightName ? "You arrive" : "Stops away"}</div><div class="v num">${r.alightName ? (next.off ? `${next.offEst ? "≈" : ""}${hm(next.off)}` : "—") : (stopsAway(next, now) ?? "—")}</div></div>
    </div>
    ${s.leaveIn > 0 ? `<button class="hero-btn" data-alarm="${s.leaveAt}" data-bus="${hm(next.at)}">⏰ Phone alarm for ${hm(s.leaveAt)}</button>` : ""}
  </div>`;
}
function renderAlarm() {
  if (!route()) { $("alarmRow").innerHTML = ""; return; }
  $("alarmRow").innerHTML = `<div class="card row"><div class="ic">🔔</div>
    <div class="tx"><div class="t">Leave-now alarm</div><div class="s">${watching ? "On · keep this screen open" : "Off · rings here when it's time to go"}</div></div>
    <button class="switch ${watching ? "on" : ""}" id="watchBtn" role="switch" aria-checked="${watching}" aria-label="Leave-now alarm"></button></div>`;
}
function renderList() {
  const r = route(), now = Date.now();
  if (!r) { $("list").innerHTML = ""; $("foot").textContent = ""; return; }
  const buses = live.filter(b => b.at > now - MIN);
  let h = "";
  if (status && status !== "Good Service") h += `<details class="card notice" ${openNotice ? "open" : ""}><summary><span class="ndot"></span><span class="tx"><b>${esc(status)}</b>
      <span>${disruptions.length} update${disruptions.length === 1 ? "" : "s"} from TfL</span></span><span class="chev">›</span></summary>
      ${disruptions.map(d => `<p>${esc(d)}</p>`).join("")}</details>`;
  h += `<div class="head"><h2>Live buses</h2><span>${buses.length ? `<i class="dot"></i>${buses.length} tracked` : ""}</span></div><div class="card">`;
  if (lineGone) h += `<div class="warn">⚠︎ TfL no longer lists route ${esc(r.line.toUpperCase())}. It may have been withdrawn.</div>`;
  if (err) h += `<div class="warn">${esc(err)}</div>`;
  else if (!buses.length) h += `<div class="list-empty">${loading ? "Loading…" : `No ${esc(r.line.toUpperCase())} buses tracked in the next ~30 minutes.`}</div>`;
  for (const b of buses) {
    const s = stateOf(r, b.at, now), away = stopsAway(b, now), near = nearName(b, now);
    const state = s.cls === "late" ? "Missed" : s.cls === "now" ? "Leave now" : `Leave ${hm(s.leaveAt)}`;
    h += `<div class="bus ${s.cls}">
      <div class="mins num"><b>${s.eta < 1 ? "Due" : Math.floor(s.eta)}</b><i>${s.eta < 1 ? "" : "min"}</i></div>
      <div class="mid"><div class="t num">${hm(b.at)}${b.off ? ` <span style="color:var(--dim);font-weight:500">→ ${b.offEst ? "≈" : ""}${hm(b.off)}</span>` : ""}</div>
        <div class="s">${away != null ? `${away} stop${away === 1 ? "" : "s"} away` : ""}${near ? ` · near ${esc(near)}` : ""}</div></div>
      <span class="state">${state}</span></div>`;
  }
  h += `</div>`;
  $("list").innerHTML = h;
  const good = status === "Good Service";
  $("foot").innerHTML = `${good ? `<span style="color:var(--green)">●</span> Good service on the ${esc(r.line.toUpperCase())} · ` : ""}Live TfL data${live.some(b => b.offEst) ? " · ≈ arrival from TfL Journey Planner until the live time is published" : ""}${fetched ? ` · updated ${Math.round((now - fetched) / 1000)}s ago` : ""}`;
}

// ---------- in-app alarm ----------
let watching = false, alarmed = new Set(), wakeLock = null, audio = null, beepTimer = null;
function beep() {
  if (!audio) return;
  const t = audio.currentTime;
  [0, .2, .4].forEach(d => { const o = audio.createOscillator(), g = audio.createGain();
    o.type = "square"; o.frequency.value = 880; g.gain.value = .22; o.connect(g).connect(audio.destination); o.start(t + d); o.stop(t + d + .13); });
}
function checkAlarm() {
  const r = route(), now = Date.now(); if (!watching || !r) return;
  for (const b of live) {
    const { leaveIn } = stateOf(r, b.at, now);
    if (leaveIn >= -1 && leaveIn <= r.buffer && !alarmed.has(b.id)) {
      alarmed.add(b.id);
      $("bannerText").textContent = `The ${r.line.toUpperCase()} reaches ${r.boardStop} at ${hm(b.at)}`;
      $("banner").classList.add("show"); clearInterval(beepTimer); beep(); beepTimer = setInterval(beep, 1200);
      navigator.vibrate?.([400, 200, 400]);
    }
  }
}
function stopAlarm() { clearInterval(beepTimer); $("banner").classList.remove("show"); }
async function setWatching(on) {
  watching = on; alarmed = new Set();
  if (on) {
    audio ||= new (window.AudioContext || window.webkitAudioContext)(); await audio.resume();
    const r = route(), now = Date.now();
    live.forEach(b => { if (stateOf(r, b.at, now).leaveIn <= r.buffer) alarmed.add(b.id); });   // skip buses already past the point
    try { wakeLock = await navigator.wakeLock?.request("screen"); } catch {}
  } else { stopAlarm(); wakeLock?.release?.(); wakeLock = null; }
  renderAlarm();
}
document.addEventListener("visibilitychange", async () => {
  if (document.visibilityState !== "visible") return;
  refresh(); if (watching) try { wakeLock = await navigator.wakeLock?.request("screen"); } catch {}
});

function switchTo(i) {
  current = i; save(); live = []; seq = null; status = null; disruptions = []; err = ""; loading = true;
  setWatching(false); renderAll(); refresh();
}

      <div class="tx"><div class="t">${esc(r.name)}</div><div class="s">${esc(r.boardStop)} · Stop ${esc(r.boardLetter)}${r.alightName ? ` → ${esc(r.alightName)}${r.alightLetter ? ` · ${esc(r.alightLetter)}` : ""}` : ""}</div></div>

// ---------- add-route wizard ----------
let w = null;
const STEPS = 5;
function openWizard() { $("routesDlg").close(); w = { step:1, walk:10, buffer:1 }; drawWizard(); $("wiz").showModal(); }
function drawWizard() {
  $("wSteps").innerHTML = Array.from({ length:STEPS }, (_, i) => `<i class="${i < w.step ? "on" : ""}"></i>`).join("");
  $("wBack").textContent = w.step === 1 ? "Cancel" : "‹ Back";
  const B = $("wBody");
  if (w.step === 1) {
    B.innerHTML = `<div class="sh-title">Which bus?</div><p class="sh-sub">Pick your bus number.</p>
      <div class="search">${icon.search}<input id="wq" placeholder="Search, e.g. 135" autocomplete="off" autocapitalize="characters"></div>
      <div id="wLines"><div class="loading">Loading…</div></div>`;
    busLines().then(ids => { w.ids = ids; drawLines(); });
    $("wq").oninput = drawLines;
  } else if (w.step === 2) {
    B.innerHTML = `<div class="sh-title">Which direction?</div><p class="sh-sub">Bus ${esc(w.line.toUpperCase())}</p><div id="wDirs"><div class="loading">Loading…</div></div>`;
    Promise.allSettled(["outbound", "inbound"].map(d => sequence(w.line, d))).then(res => {
      const opts = res.map((x, i) => ({ dir: i ? "inbound" : "outbound", s: x.value })).filter(o => o.s?.orders.length);
      w.seqs = Object.fromEntries(opts.map(o => [o.dir, o.s]));
      $("wDirs").innerHTML = opts.map(o => `<button class="dir" data-dir="${o.dir}"><div class="k">Towards</div><div class="v">${esc(o.s.to)}</div>
        <div class="s">From ${esc(o.s.from)} · ${o.s.orders[0].length} stops</div></button>`).join("") || `<div class="loading">No route info for this bus.</div>`;
    });
  } else if (w.step === 3 || w.step === 4) {
    const s = w.seqs[w.dir], order = s.orders[0];
    const list = w.step === 3 ? order.slice(0, -1) : order.slice(order.indexOf(w.board) + 1);
    B.innerHTML = `<div class="sh-title">${w.step === 3 ? "Where do you get on?" : "Where do you get off?"}</div>
      <p class="sh-sub">${w.step === 3 ? `Towards ${esc(s.to)}` : `From ${esc(s.stops[w.board].name)}`}</p>
      <div class="search">${icon.search}<input id="wq" placeholder="Search stops" autocomplete="off"></div>
      <div class="tl" id="wStops"></div>
`;
    const draw = () => {
      const q = $("wq").value.toLowerCase();
      $("wStops").innerHTML = list.map(id => s.stops[id]).filter(x => x.name.toLowerCase().includes(q)).map(x =>
        `<button data-stop="${x.id}"><span class="pt">${esc(x.letter.slice(0, 2))}</span><span><div class="nm">${esc(x.name)}</div>
         ${x.letter ? `<div class="tw">Stop ${esc(x.letter)}</div>` : ""}</span></button>`).join("") || `<div class="loading">No matching stops</div>`;
    };
    $("wq").oninput = draw; draw();
  } else {
    const s = w.seqs[w.dir], b = s.stops[w.board], a = w.alight && s.stops[w.alight];
    w.name ??= a ? `${w.line.toUpperCase()} to ${a.name.split(/[\/,]/)[0].trim()}` : `${w.line.toUpperCase()} from ${b.name}`;
    B.innerHTML = `<div class="sh-title">Your walk</div><p class="sh-sub">How long to get to ${esc(b.name)}${b.letter ? ` (Stop ${esc(b.letter)})` : ""}?</p>
      ${stepper("walk", "Walk to the stop", "From your door", w.walk)}
      ${stepper("buffer", "Spare time", "Extra margin", w.buffer)}
      <div class="field"><label>Route name</label><input id="wName" value="${esc(w.name)}"></div>
      <button class="primary" id="wSave">Save route</button>`;
    $("wName").oninput = e => { w.name = e.target.value; };
  }
}
function lineGroup(id) {
  const p = id.replace(/\d.*$/, "").toUpperCase(), n = +(id.match(/\d+/)?.[0] || 0);
  if (!p) return n < 100 ? "1–99" : `${Math.floor(n / 100) * 100}–${Math.floor(n / 100) * 100 + 99}`;
  return p === "N" ? "Night buses (N)" : p === "SL" ? "Superloop (SL)" : `${p} routes`;
}
function drawLines() {
  const q = ($("wq")?.value || "").trim().toLowerCase();
  const ids = (w.ids || []).filter(id => !q || id.includes(q));
  const groups = new Map();
  for (const id of ids) { const g = lineGroup(id); if (!groups.has(g)) groups.set(g, []); groups.get(g).push(id); }
  $("wLines").innerHTML = [...groups].map(([g, list]) => `<div class="lgroup">${esc(g)}<span>${list.length}</span></div>
    <div class="lines">${list.map(id => `<button data-line="${esc(id)}">${esc(id.toUpperCase())}</button>`).join("")}</div>`).join("")
    || `<div class="loading">No bus called “${esc(q)}”</div>`;
}
$("wBack").onclick = () => { if (w.step === 1) $("wiz").close(); else { w.step--; drawWizard(); } };
$("wBody").addEventListener("click", e => {

  else if (t.dataset.dir) { w.dir = t.dataset.dir; w.step = 3; }
  else if (t.dataset.stop && w.step === 3) { w.board = t.dataset.stop; w.step = 4; }
  else if (t.dataset.stop && w.step === 4) { w.alight = t.dataset.stop; w.step = 5; }
  else if (t.id === "wSave") {
    const s = w.seqs[w.dir], b = s.stops[w.board], a = w.alight && s.stops[w.alight];
    routes.push({ name: w.name.trim() || b.name, line: w.line, direction: w.dir, boardId: b.id, boardStop: b.name, boardLetter: b.letter,
      alightId: a?.id || null, alightName: a?.name || null, alightLetter: a?.letter || "", walk: w.walk, buffer: w.buffer, ready: 5 });
    $("wiz").close(); switchTo(routes.length - 1); return;
  } else return;
  w.name = undefined; drawWizard(); $("wBody").scrollTop = 0;

  else if (t.id === "switcher") openRoutes();
  else if (t.id === "addBtn") openWizard();
  else if (t.dataset.tab !== undefined) { pickedManually = true; $("routesDlg").close(); switchTo(+t.dataset.tab); }
  else if (t.id === "editBtn") openEdit();
  else if (t.id === "eDelete") { if (!route().builtin && confirm(`Delete “${route().name}”?`)) { routes.splice(current, 1); $("editDlg").close(); switchTo(0); } }
  else if (t.id === "watchBtn") setWatching(!watching);
  else if (t.id === "stopAlarm") stopAlarm();
  else if (t.dataset.close !== undefined) t.closest("dialog").close();
  else if (t.dataset.alarm) openAlarm(+t.dataset.alarm, t.dataset.bus);
  else if (t.id === "runShortcut") runShortcut();
  else if (t.id === "showGuide") { $("guide").hidden = false; t.hidden = true; $("guide").scrollIntoView({ behavior:"smooth" }); }
  else if (t.id === "guideDone") { localStorage.setItem("shortcutReady", "1"); runShortcut(); }
  else if (t.id === "useInApp") { $("alarmDlg").close(); if (!watching) setWatching(true); }
});
document.addEventListener("toggle", e => { if (e.target.classList?.contains("notice")) openNotice = e.target.open; }, true);
// close sheets by tapping the backdrop
document.querySelectorAll("dialog").forEach(d => d.addEventListener("click", e => { if (e.target === d) d.close(); }));

// ---------- go ----------
// ---------- open the right route for where you are (location never leaves the phone) ----------
const PLACES = [   // near this point -> open this built-in route
  { lat:51.52193, lon:-0.07815, route:"135-home" },      // work: Commercial Street / Worship Street (Stop D)
  { lat:51.50287, lon:-0.01819, route:"135-to-work" },   // home side: Canary Wharf Station (Stop K)
];
const NEAR_KM = 2;
function km(a, b, c, d) {
  const r = x => x * Math.PI / 180, h = Math.sin(r(c - a) / 2) ** 2 + Math.cos(r(a)) * Math.cos(r(c)) * Math.sin(r(d - b) / 2) ** 2;
  return 12742 * Math.asin(Math.sqrt(h));
}
let pickedManually = false;
function pickByLocation() {
  if (!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(pos => {
    if (pickedManually) return;   // you already chose a route yourself
    const { latitude:la, longitude:lo } = pos.coords;
    const near = PLACES.map(p => ({ ...p, d: km(la, lo, p.lat, p.lon) })).filter(p => p.d <= NEAR_KM).sort((a, b) => a.d - b.d)[0];
    const i = near ? routes.findIndex(r => r.id === near.route) : -1;
    if (i >= 0 && i !== current) switchTo(i);
  }, () => {}, { enableHighAccuracy:false, timeout:10000, maximumAge:5 * MIN });
}

renderAll(); refresh(); busLines(); pickByLocation();
setInterval(() => { renderAll(); checkAlarm(); }, 1000);
setInterval(refresh, POLL_MS);
</script>
